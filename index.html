<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 Dżungla Przygód</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }
    canvas { display: block; cursor: crosshair; }

    #hud {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 22px; align-items: center;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
      padding: 10px 26px; border-radius: 32px; color: white;
      font-size: 19px; font-weight: bold; z-index: 200;
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      white-space: nowrap;
    }

    #controls {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 7px; z-index: 200; flex-wrap: wrap; justify-content: center;
    }

    .btn {
      padding: 8px 14px; border-radius: 22px;
      border: 2px solid rgba(255,255,255,0.25);
      cursor: pointer; font-size: 13px; font-weight: bold;
      transition: all 0.15s; backdrop-filter: blur(6px);
      background: rgba(0,0,0,0.5); color: white;
      user-select: none;
    }
    .btn:hover { transform: scale(1.09); border-color: rgba(255,255,255,0.65); }
    .btn:active { transform: scale(0.93); }
    .btn.active { border-color: #FFD700; box-shadow: 0 0 12px rgba(255,215,0,0.55); }

    .divider { color: rgba(255,255,255,0.3); padding: 0 4px; align-self: center; font-size: 20px; }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <span id="hearts"></span>
  <span>⭐ <span id="score">0</span></span>
  <span id="timeLabel">☀️ Dzień</span>
</div>

<div id="controls">
  <button class="btn" id="btn-dawn"  onclick="setTOD('dawn')">🌅 Świt</button>
  <button class="btn active" id="btn-day"   onclick="setTOD('day')">☀️ Dzień</button>
  <button class="btn" id="btn-dusk"  onclick="setTOD('dusk')">🌆 Zmierzch</button>
  <button class="btn" id="btn-night" onclick="setTOD('night')">🌙 Noc</button>
  <span class="divider">|</span>
  <button class="btn" id="btn-spring" onclick="setSeason('spring')">🌸 Wiosna</button>
  <button class="btn active" id="btn-summer" onclick="setSeason('summer')">🌿 Lato</button>
  <button class="btn" id="btn-autumn" onclick="setSeason('autumn')">🍂 Jesień</button>
  <button class="btn" id="btn-winter" onclick="setSeason('winter')">❄️ Zima</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

/* ── STATE ───────────────────────────────────────── */
let lives = 10, score = 0, tod = 'day', season = 'summer';
let gameOver = false, gameWon = false, frame = 0;
let cubes = [], balls = [], effects = [], lastSpawn = 0, spawnDelay = 2500;
let lastBallSpawn = 0;
let hamster = { x: 150, dir: 1, speed: 1.3 };
let elephant = { x: 0,   dir: 1, speed: 0.75 };

const WIN_SCORE = 40;

/* ── CONFIG ──────────────────────────────────────── */
const TOD = {
  dawn:  { sky: ['#1a1540','#FF6B9D','#FFB347'], amb: 0.68, fog: 'rgba(255,90,40,0.10)' },
  day:   { sky: ['#1E90FF','#87CEEB','#C8EDFF'], amb: 1.00, fog: null },
  dusk:  { sky: ['#6B0A00','#DD3A00','#FF7043'], amb: 0.50, fog: 'rgba(90,0,0,0.15)' },
  night: { sky: ['#010210','#08082a','#0d0d3e'], amb: 0.22, fog: 'rgba(0,0,50,0.45)' }
};
const SEASONS = {
  spring: { leaves:['#A8E063','#56C22A','#90EE90'], trunk:'#8B5E3C', gTop:'#5DBE4A', gBot:'#3D9A2F' },
  summer: { leaves:['#228B22','#1B7A1B','#2E8B57'], trunk:'#6B3A2A', gTop:'#4CAF50', gBot:'#2E7D32' },
  autumn: { leaves:['#D2691E','#FF8C00','#A0522D'], trunk:'#8B4513', gTop:'#8B7355', gBot:'#6B5B3E' },
  winter: { leaves:['#9BB8CC','#7A9EB5','#B0C8D8'], trunk:'#696969', gTop:'#E0EEF5', gBot:'#B8D4E0' }
};

/* ── AUDIO ───────────────────────────────────────── */
let audioCtx = null;
let musicNextTime = 0;
let melodyIdx = 0;
let musicTimer = null;

const MELODY = [
  [523,0.25],[659,0.25],[784,0.25],[880,0.5],
  [784,0.25],[659,0.25],[523,0.25],[392,0.5],
  [440,0.25],[523,0.25],[659,0.5],[523,0.25],
  [392,0.25],[440,0.25],[523,0.75]
];

function ensureAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musicNextTime = audioCtx.currentTime + 0.1;
  scheduleMusicBatch();
}

function scheduleMusicBatch() {
  if (!audioCtx) return;
  const ahead = 2.5;
  while (musicNextTime < audioCtx.currentTime + ahead) {
    const [freq, dur] = MELODY[melodyIdx % MELODY.length];
    playTone(freq, musicNextTime, dur * 0.82, 0.06, 'triangle');
    if (melodyIdx % 4 === 0) playTone(freq / 2, musicNextTime, dur * 0.5, 0.04, 'sine');
    musicNextTime += dur;
    melodyIdx++;
  }
  musicTimer = setTimeout(scheduleMusicBatch, 600);
}

function playTone(freq, start, dur, vol, type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.05);
}

function sfxCollect() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(880, t, 0.1, 0.22, 'sine');
  playTone(1108, t + 0.07, 0.12, 0.18, 'sine');
  playTone(1318, t + 0.14, 0.1, 0.14, 'sine');
}

function sfxLoseLife() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  playTone(300, t, 0.12, 0.28, 'sawtooth');
  playTone(200, t + 0.1, 0.2, 0.22, 'sawtooth');
  playTone(150, t + 0.22, 0.2, 0.18, 'sawtooth');
}

function sfxGameOver() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [440,330,220,165].forEach((f,i) => playTone(f, t + i*0.22, 0.28, 0.2, 'sawtooth'));
}

function sfxWin() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [523,659,784,1047,1319,1047,784,659,523].forEach((f,i) => {
    playTone(f, t + i*0.14, 0.18, 0.18, 'triangle');
  });
}

/* ── CONTROLS ────────────────────────────────────── */
const TOD_LABELS = { dawn:'🌅 Świt', day:'☀️ Dzień', dusk:'🌆 Zmierzch', night:'🌙 Noc' };
function setTOD(t) {
  tod = t;
  document.getElementById('timeLabel').textContent = TOD_LABELS[t];
  document.querySelectorAll('.btn').forEach(b => { if (b.id.startsWith('btn-') && ['dawn','day','dusk','night'].includes(b.id.slice(4))) b.classList.remove('active'); });
  document.getElementById('btn-'+t).classList.add('active');
  if (t === 'night') cubes = [];
}
function setSeason(s) {
  season = s;
  document.querySelectorAll('.btn').forEach(b => { if (['btn-spring','btn-summer','btn-autumn','btn-winter'].includes(b.id)) b.classList.remove('active'); });
  document.getElementById('btn-'+s).classList.add('active');
}
function updateHUD() {
  document.getElementById('hearts').textContent = '❤️'.repeat(Math.max(0,lives)) + '🖤'.repeat(Math.max(0,10-lives));
  document.getElementById('score').textContent = score;
}
function addFx(x, y, txt, col) { effects.push({x,y,txt,col,life:0,max:58}); }

/* ── COLOR HELPERS ───────────────────────────────── */
function dimHex(hex, b) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), bl=parseInt(hex.slice(5,7),16);
  return `rgb(${~~(r*b)},${~~(g*b)},${~~(bl*b)})`;
}
function dimRGB(r,g,b,a,bright) { return `rgba(${~~(r*bright)},${~~(g*bright)},${~~(b*bright)},${a})`; }

/* ── DRAW BACKGROUND ─────────────────────────────── */
function drawBg() {
  const W=canvas.width, H=canvas.height, cfg=TOD[tod], sc=SEASONS[season];
  const gH = H*0.72;

  const sg = ctx.createLinearGradient(0,0,0,gH);
  cfg.sky.forEach((c,i) => sg.addColorStop(i/(cfg.sky.length-1), c));
  ctx.fillStyle = sg; ctx.fillRect(0,0,W,gH);

  if (tod==='night'||tod==='dusk') {
    const sa = tod==='night'?0.88:0.38;
    for (let i=0;i<130;i++) {
      const sx=(Math.sin(i*127.1+3)*0.5+0.5)*W;
      const sy=(Math.cos(i*89.7+1)*0.5+0.5)*H*0.52;
      const sr=(Math.sin(i*53)*0.5+0.5)*1.5+0.3;
      const tw=tod==='night'?(Math.sin(frame*0.04+i)*0.4+0.6):1;
      ctx.fillStyle=`rgba(255,255,240,${sa*tw})`;
      ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
    }
  }

  const SUNS = {
    dawn: {x:0.12,y:0.26,r:28,c:'#FFB347',g:'#FF6B9D'},
    day:  {x:0.76,y:0.09,r:40,c:'#FFE066',g:'#FFD700'},
    dusk: {x:0.89,y:0.34,r:36,c:'#FF6B35',g:'#FF4500'}
  };
  if (tod!=='night') {
    const sp=SUNS[tod];
    ctx.save();
    ctx.shadowBlur=45; ctx.shadowColor=sp.g;
    ctx.fillStyle=sp.c;
    ctx.beginPath(); ctx.arc(W*sp.x,H*sp.y,sp.r,0,Math.PI*2); ctx.fill();
    if (tod==='day') {
      ctx.strokeStyle='rgba(255,224,0,0.28)'; ctx.lineWidth=2.5;
      for (let r=0;r<8;r++) {
        const a=(r/8)*Math.PI*2+frame*0.006;
        ctx.beginPath();
        ctx.moveTo(W*sp.x+Math.cos(a)*52,H*sp.y+Math.sin(a)*52);
        ctx.lineTo(W*sp.x+Math.cos(a)*72,H*sp.y+Math.sin(a)*72);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  if (tod==='night') {
    ctx.save();
    ctx.shadowBlur=35; ctx.shadowColor='#FFFACD';
    ctx.fillStyle='#FFFACD';
    ctx.beginPath(); ctx.arc(W*0.82,H*0.11,40,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=cfg.sky[1]; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(W*0.82+20,H*0.11-9,32,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const gg=ctx.createLinearGradient(0,gH,0,H);
  gg.addColorStop(0,sc.gTop); gg.addColorStop(1,sc.gBot);
  ctx.fillStyle=gg; ctx.fillRect(0,gH,W,H-gH);
  ctx.fillStyle=season==='winter'?'#D0E8F0':'#5DBE4A';
  ctx.beginPath(); ctx.ellipse(W/2,gH+4,W*0.53,H*0.018,0,0,Math.PI*2); ctx.fill();
}

/* ── DRAW TREE ───────────────────────────────────── */
function drawTree(x,gy,scale,li) {
  const sc=SEASONS[season], b=TOD[tod].amb;
  ctx.save(); ctx.translate(x,gy); ctx.scale(scale,scale);
  ctx.fillStyle=dimHex(sc.trunk,b);
  ctx.beginPath(); ctx.moveTo(-13,0); ctx.lineTo(-9,-88); ctx.lineTo(9,-88); ctx.lineTo(13,0); ctx.fill();
  ctx.fillStyle=dimHex(sc.leaves[li%sc.leaves.length],b);
  [[0,-118,54],[-38,-94,38],[38,-94,38],[-20,-152,36],[20,-152,36],[0,-175,30]].forEach(([cx,cy,cr])=>{
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });
  if (season==='winter') {
    ctx.fillStyle=`rgba(210,235,250,${0.72*b})`;
    [[0,-118,54],[-38,-94,38],[38,-94,38],[-20,-152,36],[20,-152,36],[0,-175,30]].forEach(([cx,cy,cr])=>{
      ctx.beginPath(); ctx.arc(cx,cy-cr*0.08,cr*0.88,Math.PI,Math.PI*2); ctx.fill();
    });
  }
  ctx.restore();
}

/* ── DRAW PALM ───────────────────────────────────── */
function drawPalm(x,gy) {
  const b=TOD[tod].amb;
  const sway=Math.sin(frame*0.018)*10;
  ctx.save(); ctx.translate(x,gy);
  ctx.strokeStyle=dimRGB(100,65,30,1,b); ctx.lineWidth=16; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(18,-52,-8,-105,6,-142); ctx.stroke();
  const lc = season==='winter'?[90,115,100]:[40,155,45];
  ctx.strokeStyle=dimRGB(lc[0],lc[1],lc[2],1,b); ctx.lineWidth=7;
  [[ 65,-28],[-65,-18],[ 45,-65],[-42,-58],[  8,-72]].forEach(([dx,dy])=>{
    ctx.beginPath();
    ctx.moveTo(6,-142); ctx.quadraticCurveTo(dx/2+sway/2,-142+dy/2,dx+sway,-142+dy); ctx.stroke();
  });
  ctx.restore();
}

/* ── DRAW BUSH ───────────────────────────────────── */
function drawBush(x,gy,w) {
  const sc=SEASONS[season], b=TOD[tod].amb;
  ctx.save(); ctx.translate(x,gy); ctx.scale(w,1);
  ctx.fillStyle=dimHex(sc.leaves[1],b);
  [[0,0,27],[-24,7,21],[24,7,21],[-11,-16,17],[11,-16,17]].forEach(([cx,cy,cr])=>{
    ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

/* ── DRAW JUNGLE ─────────────────────────────────── */
function drawJungle() {
  const W=canvas.width, H=canvas.height, gy=H*0.72;
  [[0.04,0.52,2],[0.16,0.57,0],[0.30,0.55,1],[0.48,0.60,2],
   [0.63,0.53,0],[0.77,0.56,1],[0.93,0.54,2]].forEach(([rx,s,li])=>drawTree(W*rx,gy,s*0.88,li));
  [[0.01,0.84,1],[0.12,0.90,0],[0.24,0.82,2],[0.37,0.88,1],
   [0.54,0.85,0],[0.68,0.92,2],[0.84,0.83,1],[0.97,0.87,0]].forEach(([rx,s,li])=>drawTree(W*rx,gy,s,li));
  if (season!=='winter') { drawPalm(W*0.43,gy); drawPalm(W*0.61,gy); }
  [[0.06,1.2],[0.19,0.9],[0.32,1.1],[0.47,0.85],[0.57,1.15],[0.71,0.9],[0.83,1.05],[0.96,0.95]]
    .forEach(([rx,w])=>drawBush(W*rx,gy,w));

  if (season==='winter') {
    ctx.fillStyle='rgba(255,255,255,0.75)';
    for (let i=0;i<70;i++) {
      const sx=(Math.sin(i*137.5+frame*0.008)*0.5+0.5)*W;
      const sy=((Math.cos(i*97.3)*0.5+0.5+(frame*0.0018*(0.4+(i%3)*0.22)))%1)*H;
      ctx.beginPath(); ctx.arc(sx,sy,1.8,0,Math.PI*2); ctx.fill();
    }
  }
}

/* ── DRAW HAMSTER ────────────────────────────────── */
function drawHamster(x,y,sleeping,dir) {
  const b=TOD[tod].amb;
  ctx.save(); ctx.translate(x,y);
  if (dir<0) ctx.scale(-1,1);
  const walk=Math.sin(frame*0.13)*7;
  if (!sleeping) ctx.translate(0,-Math.abs(Math.sin(frame*0.13))*4);

  if (sleeping) {
    ctx.fillStyle=dimRGB(212,167,106,1,b);
    ctx.beginPath(); ctx.ellipse(0,0,36,21,0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(245,222,196,1,b);
    ctx.beginPath(); ctx.ellipse(10,5,20,12,0.28,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(212,167,106,1,b);
    ctx.beginPath(); ctx.arc(31,-7,17,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=dimRGB(80,55,38,1,b); ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(38,-10,4,0,Math.PI); ctx.stroke();
    ctx.fillStyle=dimRGB(212,167,106,1,b); ctx.beginPath(); ctx.arc(26,-22,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(255,155,170,1,b); ctx.beginPath(); ctx.arc(26,-22,5,0,Math.PI*2); ctx.fill();
    ctx.font='17px Arial'; ctx.fillText('💤',38,-22);
  } else {
    ctx.fillStyle=dimRGB(212,167,106,1,b);
    ctx.beginPath(); ctx.ellipse(0,0,36,25,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(245,230,200,1,b);
    ctx.beginPath(); ctx.ellipse(0,7,21,15,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(212,167,106,1,b);
    ctx.beginPath(); ctx.arc(34,-12,25,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(232,184,138,1,b);
    ctx.beginPath(); ctx.arc(38,-4,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(240,200,158,1,b);
    ctx.beginPath(); ctx.arc(27,-4,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(212,167,106,1,b); ctx.beginPath(); ctx.arc(28,-33,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(255,155,170,1,b); ctx.beginPath(); ctx.arc(28,-33,6.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(44,24,16,1,b); ctx.beginPath(); ctx.arc(43,-17,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(45,-19,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(255,155,170,1,b); ctx.beginPath(); ctx.arc(55,-10,4.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=dimRGB(80,55,38,1,b); ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(55,-7,3,0,Math.PI); ctx.stroke();
    ctx.fillStyle=dimRGB(196,154,90,1,b);
    [-18,-6,8,20].forEach((lx,i)=>{
      const la=walk*(i%2===0?1:-1)*0.06;
      ctx.save(); ctx.translate(lx,20); ctx.rotate(la);
      ctx.beginPath(); ctx.roundRect(-5,0,10,15,4); ctx.fill(); ctx.restore();
    });
    ctx.fillStyle=dimRGB(196,154,90,1,b); ctx.beginPath(); ctx.arc(-34,-1,9,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ── DRAW ELEPHANT ───────────────────────────────── */
function drawElephant(x,y,sleeping,dir) {
  const b=TOD[tod].amb;
  const BASE=dimRGB(110,128,145,1,b), DARK=dimRGB(72,88,102,1,b), LIGHT=dimRGB(152,165,178,1,b);
  ctx.save(); ctx.translate(x,y);
  if (dir<0) ctx.scale(-1,1);
  const walk=sleeping?0:Math.sin(frame*0.075)*9;
  if (!sleeping) ctx.translate(0,-Math.abs(Math.sin(frame*0.075))*5);

  if (sleeping) {
    ctx.fillStyle=BASE;
    ctx.beginPath(); ctx.ellipse(0,0,78,40,0.14,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(68,-14,42,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=LIGHT;
    ctx.beginPath(); ctx.ellipse(48,-8,28,44,-0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(190,160,148,1,b);
    ctx.beginPath(); ctx.ellipse(48,-8,17,30,-0.2,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=DARK; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(86,-20,6,0,Math.PI); ctx.stroke();
    ctx.fillStyle=BASE;
    ctx.beginPath();
    ctx.moveTo(102,-6); ctx.quadraticCurveTo(126,14,112,30);
    ctx.quadraticCurveTo(102,36,96,30); ctx.quadraticCurveTo(108,14,84,-2); ctx.fill();
    ctx.font='22px Arial'; ctx.fillText('💤',108,-38);
  } else {
    ctx.fillStyle=DARK;
    [-52,-22,12,42].forEach((lx,i)=>{
      const la=walk*(i%2===0?1:-1)*0.042;
      ctx.save(); ctx.translate(lx,44); ctx.rotate(la);
      ctx.beginPath(); ctx.roundRect(-13,0,26,52,8); ctx.fill();
      ctx.fillStyle=LIGHT;
      ctx.beginPath(); ctx.ellipse(0,52,15,7,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
    ctx.fillStyle=BASE;
    ctx.beginPath(); ctx.ellipse(0,0,78,53,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=LIGHT;
    ctx.beginPath(); ctx.ellipse(0,16,50,30,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=BASE;
    ctx.beginPath(); ctx.arc(73,-20,47,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=LIGHT;
    ctx.beginPath(); ctx.ellipse(53,-8,29,47,-0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(190,155,145,1,b);
    ctx.beginPath(); ctx.ellipse(53,-8,18,31,-0.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=dimRGB(20,12,5,1,b); ctx.beginPath(); ctx.arc(94,-30,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(96,-32,2.5,0,Math.PI*2); ctx.fill();
    const ts=Math.sin(frame*0.065)*13;
    ctx.fillStyle=BASE;
    ctx.beginPath();
    ctx.moveTo(110,-8);
    ctx.bezierCurveTo(140+ts,12,132+ts,52,108,68);
    ctx.bezierCurveTo(98,74,88,62,100,58);
    ctx.bezierCurveTo(118,48,122+ts*0.5,12,93,-4);
    ctx.fill();
    ctx.fillStyle=DARK; ctx.beginPath(); ctx.ellipse(103,65,9,6,0.3,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=dimRGB(255,250,195,0.9,b); ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(98,-4); ctx.quadraticCurveTo(134,9,126,27); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(92,-1); ctx.quadraticCurveTo(128,14,120,32); ctx.stroke();
    ctx.strokeStyle=BASE; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(-78,-4); ctx.quadraticCurveTo(-105,-22,-98,10); ctx.stroke();
  }
  ctx.restore();
}

/* ── DRAW SUGAR CUBE ─────────────────────────────── */
function drawCube(c) {
  const age=(Date.now()-c.spawn)/c.life;
  const alpha=age>0.62?1-(age-0.62)/0.38:1;
  const pulse=1+Math.sin(frame*0.14+c.id*8)*0.055;
  ctx.save();
  ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.scale(pulse,pulse);
  ctx.globalAlpha=alpha;
  ctx.shadowBlur=18; ctx.shadowColor='#80C8F0';
  ctx.fillStyle='#FFFFFF'; ctx.strokeStyle='#B8D4E8'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(-22,-22,44,44,7); ctx.fill(); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#C0DCF0';
  [[-9,-9],[9,-9],[-9,9],[9,9],[0,0],[-9,0],[9,0],[0,-9],[0,9]].forEach(([dx,dy])=>{
    ctx.beginPath(); ctx.arc(dx,dy,2,0,Math.PI*2); ctx.fill();
  });
  const sa=Math.sin(frame*0.16+c.id*12)*0.5+0.5;
  ctx.fillStyle=`rgba(80,160,255,${sa})`; ctx.font='bold 14px Arial';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('✦',0,0);
  ctx.restore();
}

/* ── DRAW BALL (pułapka) ─────────────────────────── */
function drawBall(b) {
  const age = (Date.now() - b.spawn) / b.life;
  const alpha = age > 0.7 ? 1 - (age - 0.7) / 0.3 : 1;
  const bounce = Math.abs(Math.sin(frame * 0.12 + b.id * 7)) * 14;
  const wobble = Math.sin(frame * 0.18 + b.id * 4) * 2;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(b.x, b.y);

  // shadow on ground
  const shadowY = bounce + 32;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(wobble, shadowY, 20 - bounce * 0.3, 7, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.translate(wobble, -bounce);

  // ball gradient
  const grad = ctx.createRadialGradient(-9, -10, 3, 0, 0, 26);
  grad.addColorStop(0, '#FF8844');
  grad.addColorStop(0.45, '#DD2200');
  grad.addColorStop(1, '#880000');
  ctx.shadowBlur = 14;
  ctx.shadowColor = '#FF4400';
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-8, -9, 8, 5, -0.5, 0, Math.PI*2); ctx.fill();

  // small shine dot
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(6, 8, 4, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ── DRAW FOX ────────────────────────────────────── */
function drawFox(cx, cy, happy) {
  ctx.save();
  ctx.translate(cx, cy);

  // tail
  ctx.save();
  const tailWag = happy ? Math.sin(frame * 0.15) * 18 : Math.sin(frame * 0.04) * 5;
  ctx.translate(-55, 30);
  ctx.rotate((-0.5 + tailWag * 0.015));
  // tail base
  ctx.fillStyle = '#E06010';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-40, -20, -80, 10, -70, 50);
  ctx.bezierCurveTo(-60, 80, -20, 70, 0, 40);
  ctx.closePath();
  ctx.fill();
  // tail tip white
  ctx.fillStyle = '#F5F0E8';
  ctx.beginPath();
  ctx.ellipse(-55, 42, 22, 18, 0.4, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // body
  ctx.fillStyle = '#E06010';
  ctx.beginPath();
  ctx.ellipse(0, 30, 55, 42, 0, 0, Math.PI*2);
  ctx.fill();

  // chest white
  ctx.fillStyle = '#F5F0E8';
  ctx.beginPath();
  ctx.ellipse(0, 40, 32, 26, 0, 0, Math.PI*2);
  ctx.fill();

  // head
  ctx.fillStyle = '#E06010';
  ctx.beginPath();
  ctx.ellipse(0, -28, 50, 44, 0, 0, Math.PI*2);
  ctx.fill();

  // left ear
  ctx.fillStyle = '#E06010';
  ctx.beginPath();
  ctx.moveTo(-30, -55);
  ctx.lineTo(-58, -105);
  ctx.lineTo(-6, -78);
  ctx.closePath();
  ctx.fill();
  // left ear inner
  ctx.fillStyle = '#FF8888';
  ctx.beginPath();
  ctx.moveTo(-30, -60);
  ctx.lineTo(-52, -98);
  ctx.lineTo(-12, -78);
  ctx.closePath();
  ctx.fill();

  // right ear
  ctx.fillStyle = '#E06010';
  ctx.beginPath();
  ctx.moveTo(30, -55);
  ctx.lineTo(58, -105);
  ctx.lineTo(6, -78);
  ctx.closePath();
  ctx.fill();
  // right ear inner
  ctx.fillStyle = '#FF8888';
  ctx.beginPath();
  ctx.moveTo(30, -60);
  ctx.lineTo(52, -98);
  ctx.lineTo(12, -78);
  ctx.closePath();
  ctx.fill();

  // face white muzzle area
  ctx.fillStyle = '#F5F0E8';
  ctx.beginPath();
  ctx.ellipse(0, -14, 28, 22, 0, 0, Math.PI*2);
  ctx.fill();

  // mask markings (dark orange around eyes)
  ctx.fillStyle = '#C04808';
  ctx.beginPath();
  ctx.ellipse(-20, -38, 14, 10, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(20, -38, 14, 10, 0.3, 0, Math.PI*2);
  ctx.fill();

  // eyes
  if (happy) {
    // happy curved eyes
    ctx.strokeStyle = '#1A0A00';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(-20, -38, 9, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(20, -38, 9, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    // eye shine
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-14, -44, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(26, -44, 3, 0, Math.PI*2); ctx.fill();
  } else {
    // sad eyes - droopy
    ctx.fillStyle = '#1A0A00';
    ctx.beginPath(); ctx.ellipse(-20, -36, 7, 8, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -36, 7, 8, -0.3, 0, Math.PI*2); ctx.fill();
    // white shine
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(-17, -39, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(23, -39, 2.5, 0, Math.PI*2); ctx.fill();
    // sad eyebrows
    ctx.strokeStyle = '#1A0A00';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-30, -48); ctx.lineTo(-12, -44); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, -48); ctx.lineTo(12, -44); ctx.stroke();
    // tears
    ctx.fillStyle = 'rgba(100,160,255,0.8)';
    const tearDrop = (tx, ty) => {
      ctx.beginPath();
      ctx.arc(tx, ty, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(tx - 4, ty);
      ctx.lineTo(tx, ty + 10);
      ctx.lineTo(tx + 4, ty);
      ctx.fill();
    };
    const tearOff = (frame * 0.04) % 1;
    tearDrop(-20, -26 + tearOff * 20);
    tearDrop(20, -26 + ((tearOff + 0.5) % 1) * 20);
  }

  // nose
  ctx.fillStyle = '#1A0A00';
  ctx.beginPath();
  ctx.ellipse(0, -18, 7, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath(); ctx.arc(-2, -20, 2, 0, Math.PI*2); ctx.fill();

  // mouth
  ctx.strokeStyle = '#1A0A00';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  if (happy) {
    ctx.beginPath();
    ctx.moveTo(-12, -9);
    ctx.quadraticCurveTo(-6, -2, 0, -4);
    ctx.quadraticCurveTo(6, -2, 12, -9);
    ctx.stroke();
    // tongue
    ctx.fillStyle = '#FF6688';
    ctx.beginPath();
    ctx.ellipse(0, -1, 8, 6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#CC4466';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -5);
    ctx.lineTo(0, 3);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-14, -6);
    ctx.quadraticCurveTo(-6, -14, 0, -12);
    ctx.quadraticCurveTo(6, -14, 14, -6);
    ctx.stroke();
  }

  ctx.restore();
}

/* ── DRAW EFFECTS ────────────────────────────────── */
function drawEffects() {
  effects=effects.filter(e=>{
    e.life++;
    const t=e.life/e.max;
    ctx.save(); ctx.globalAlpha=1-t;
    ctx.fillStyle=e.col; ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=3;
    ctx.font=`bold ${28+t*12}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.strokeText(e.txt,e.x,e.y-e.life*1.9);
    ctx.fillText(e.txt,e.x,e.y-e.life*1.9);
    ctx.restore();
    return e.life<e.max;
  });
}

/* ── GAME OVER SCREEN ────────────────────────────── */
function drawGameOver() {
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';

  drawFox(W/2, H/2 - 60, false);

  ctx.shadowBlur=25; ctx.shadowColor='#FF4444';
  ctx.fillStyle='#FF6B6B'; ctx.font='bold 64px Arial';
  ctx.fillText('KONIEC GRY!',W/2,H/2+100);
  ctx.shadowColor='#FFD700'; ctx.fillStyle='#FFD700'; ctx.font='bold 38px Arial';
  ctx.fillText(`⭐ Wynik: ${score}`,W/2,H/2+158);
  ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.82)'; ctx.font='22px Arial';
  ctx.fillText('Kliknij, aby zagrać ponownie',W/2,H/2+210);
  ctx.restore();
}

/* ── WIN SCREEN ──────────────────────────────────── */
function drawWin() {
  const W=canvas.width, H=canvas.height;
  ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);

  // confetti
  for (let i=0;i<60;i++) {
    const cf=['#FFD700','#FF6B9D','#00E5FF','#69FF47','#FF9500'];
    ctx.fillStyle = cf[i%cf.length];
    const cx=(Math.sin(i*137.5+frame*0.04)*0.5+0.5)*W;
    const cy=((frame*0.006*(0.5+(i%5)*0.15)+i*0.13)%1)*H;
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(frame*0.05+i);
    ctx.fillRect(-5,-3,10,6);
    ctx.restore();
  }

  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';

  drawFox(W/2, H/2 - 60, true);

  ctx.shadowBlur=30; ctx.shadowColor='#FFD700';
  ctx.fillStyle='#FFD700'; ctx.font='bold 68px Arial';
  ctx.fillText('WYGRAŁEŚ! 🎉',W/2,H/2+110);
  ctx.shadowColor='#FFF'; ctx.fillStyle='#FFF'; ctx.font='bold 36px Arial';
  ctx.fillText(`⭐ Zebrałeś ${score} kostek!`,W/2,H/2+168);
  ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.82)'; ctx.font='22px Arial';
  ctx.fillText('Kliknij, aby zagrać ponownie',W/2,H/2+216);
  ctx.restore();
}

/* ── MAIN LOOP ───────────────────────────────────── */
function loop(ts) {
  requestAnimationFrame(loop);
  frame++;
  const W=canvas.width, H=canvas.height, gy=H*0.72;
  const sleeping=tod==='night';

  drawBg();
  drawJungle();

  if (!sleeping) {
    hamster.x+=hamster.dir*hamster.speed;
    if (hamster.x>W*0.54||hamster.x<W*0.07) hamster.dir*=-1;
    elephant.x+=elephant.dir*elephant.speed;
    if (elephant.x>W*0.90||elephant.x<W*0.42) elephant.dir*=-1;
    drawElephant(elephant.x,gy-48,false,elephant.dir);
    drawHamster(hamster.x,gy-32,false,hamster.dir);
  } else {
    drawElephant(W*0.64,gy-38,true,1);
    drawHamster(W*0.23,gy-16,true,1);
  }

  if (!sleeping && !gameOver && !gameWon) {
    // spawn sugar cubes
    if (ts-lastSpawn>spawnDelay) {
      cubes.push({
        x:80+Math.random()*(W-160), y:H*0.07+Math.random()*H*0.56,
        rot:Math.random()*Math.PI*2, spawn:Date.now(),
        life:2700+Math.random()*1900, id:Math.random()
      });
      lastSpawn=ts;
      spawnDelay=Math.max(900,spawnDelay-22);
    }

    // spawn balls every ~9 seconds
    if (ts - lastBallSpawn > 9000 + Math.random()*3000) {
      balls.push({
        x: 120 + Math.random()*(W-240),
        y: H*0.1 + Math.random()*H*0.48,
        spawn: Date.now(),
        life: 3500 + Math.random()*2000,
        id: Math.random()
      });
      lastBallSpawn = ts;
    }
  }

  const now=Date.now();

  // update & draw cubes
  cubes=cubes.filter(c=>{
    const age=now-c.spawn;
    if (age>c.life) {
      if (!gameOver && !gameWon && !sleeping) {
        lives=Math.max(0,lives-1); updateHUD();
        addFx(c.x,c.y,'💔','#FF5555');
        sfxLoseLife();
        if (lives<=0) { gameOver=true; sfxGameOver(); }
      }
      return false;
    }
    c.rot+=0.019; drawCube(c); return true;
  });

  // update & draw balls
  balls=balls.filter(b=>{
    const age=now-b.spawn;
    if (age>b.life) return false;
    drawBall(b); return true;
  });

  drawEffects();

  const fog=TOD[tod].fog;
  if (fog) { ctx.fillStyle=fog; ctx.fillRect(0,0,W,H); }

  if (gameOver) drawGameOver();
  else if (gameWon) drawWin();
}

/* ── INPUT ───────────────────────────────────────── */
canvas.addEventListener('click',e=>{
  ensureAudio();

  if (gameOver || gameWon) {
    lives=10; score=0; cubes=[]; balls=[]; spawnDelay=2500; lastSpawn=0; lastBallSpawn=0;
    gameOver=false; gameWon=false; updateHUD(); return;
  }

  const {left,top}=canvas.getBoundingClientRect();
  const mx=e.clientX-left, my=e.clientY-top;

  // check balls first (trap!)
  for (let i=balls.length-1;i>=0;i--) {
    if (Math.hypot(mx-balls[i].x,my-balls[i].y)<26) {
      const bx=balls[i].x, by=balls[i].y;
      balls.splice(i,1);
      lives=Math.max(0,lives-1); updateHUD();
      addFx(bx,by,'💔 -1 życie','#FF3333');
      sfxLoseLife();
      if (lives<=0) { gameOver=true; sfxGameOver(); }
      return;
    }
  }

  // check cubes
  for (let i=cubes.length-1;i>=0;i--) {
    if (Math.hypot(mx-cubes[i].x,my-cubes[i].y)<30) {
      addFx(cubes[i].x,cubes[i].y,'+1 ⭐','#FFD700');
      cubes.splice(i,1); score++; updateHUD();
      sfxCollect();
      if (score >= WIN_SCORE) { gameWon=true; sfxWin(); }
      break;
    }
  }
});

// init
elephant.x = canvas.width * 0.66;
updateHUD();
requestAnimationFrame(loop);
</script>
